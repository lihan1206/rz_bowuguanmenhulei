services:
  db:
    image: postgres:15-alpine
    container_name: museum-db
    environment:
      POSTGRES_DB: museum_portal
      POSTGRES_USER: museum_user
      POSTGRES_PASSWORD: museum_pass
    volumes:
      - museum_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum_user -d museum_portal"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: museum-backend
    environment:
      APP_NAME: 博物馆门户类软件
      API_PREFIX: /api
      DATABASE_URL: postgresql+psycopg2://museum_user:museum_pass@db:5432/museum_portal
      JWT_SECRET: change-this-secret-in-delivery
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/public/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: museum-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  museum_pgdata:
